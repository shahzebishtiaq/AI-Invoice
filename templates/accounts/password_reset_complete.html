{% extends "base.html" %}

{% block title %}
Password Changed
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1>Password changed</h1>

        <p class="text-muted">
            Your password was changed successfully. You can now
            log in using your new password.
        </p>

        <a
            href="{% url 'login' %}"
            class="btn btn-primary btn-full"
        >
            Log in
        </a>
    </div>
</div>
{% endblock %}
